<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mike Nedosekin</title>
<meta name="description" content="Mike Nedosekin — GitHub, LinkedIn and apps.">
<meta name="color-scheme" content="light dark">
<style>
  :root {
    --bg: #ffffff;
    --fg: #1d1d1f;
    --muted: #6e6e73;
    --line: #e5e5ea;
    --button: #f2f2f7;
    --button-hover: #e5e5ea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --fg: #f5f5f7;
      --muted: #98989d;
      --line: #2c2c2e;
      --button: #1c1c1e;
      --button-hover: #2c2c2e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--fg);
    font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main { width: 100%; max-width: 420px; padding: 48px 16px; text-align: center; }
  .photo {
    width: 160px;
    height: 160px;
    border-radius: 50%;
    object-fit: cover;
    display: block;
    margin: 0 auto 20px;
  }
  h1 { font-size: 28px; font-weight: 700; margin: 0 0 28px; letter-spacing: -.01em; }
  .links { display: grid; gap: 12px; }
  .links a {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 14px 16px;
    border-radius: 14px;
    background: var(--button);
    color: var(--fg);
    text-decoration: none;
    font-weight: 600;
  }
  .links a:hover { background: var(--button-hover); }
  .links svg { width: 20px; height: 20px; fill: currentColor; flex: none; }
  h2 {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
    margin: 40px 0 12px;
    padding-top: 24px;
    border-top: 1px solid var(--line);
  }
  .app { color: var(--fg); text-decoration: none; display: block; }
  .app b { display: block; font-size: 17px; }
  .app span { color: var(--muted); font-size: 15px; }
  .app:hover b { text-decoration: underline; }
</style>
</head>

<main>
